# Лицензии зависимостей: `cargo deny --workspace --config deny.toml check licenses` из корня (так же в CI): корни
# графа — все крейты workspace, включая glafira-load-engine и glafira-load-cli, с их dev-зависимостями.
# Белый список — только разрешительные лицензии; MPL-2.0 — копилефт на уровне файла, совместима, пока файлы этих
# крейтов не изменяются. TLS — rustls с провайдером ring (C и ассемблер ring собираются из исходников крейта
# и покрыты его лицензией). C-библиотеки rdkafka-sys (librdkafka, OpenSSL, zlib, zstd)
# cargo-deny не видит — они перечислены в THIRD_PARTY.md (scripts/third-party.mjs, C_LIBRARIES).
[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "MIT-0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

# Advisories (RustSec): `cargo deny --workspace --config deny.toml check advisories`.
# Исключения — только транзитивные unmaintained-крейты, от которых не уйти без мажорного обновления Tauri
# или его плагинов; при переходе на Tauri 3 / gtk4 / zbus 6 в плагинах список пересмотреть. Уязвимости
# (vulnerability) не игнорируем — чиним точечным `cargo update -p <крейт>`.
[advisories]
ignore = [
  # proc-macro-error 1.0.4 ← glib-macros 0.18 ← glib/gtk 0.18 — только Linux: tauri 2, tao, wry и webkit2gtk
  # требуют gtk ^0.18. proc-macro-error убран лишь в glib-macros 0.19+, до которой стек Tauri 2 не дотягивается;
  # обновить нельзя, пока Tauri не сменит GUI-стек.
  # https://rustsec.org/advisories/RUSTSEC-2024-0370
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error через glib-macros 0.18 (gtk3-rs) — зависимость tauri 2 на Linux, обновления нет" },
  # zvariant, zbus_names, zvariant_derive ← zbus 5 ← tauri-plugin-opener (только Linux, D-Bus для открытия
  # ссылок/папок). Крейты влиты в zbus 6.0.0 (2026-10-16); tauri-plugin-opener 2.7.2 и 3.0.0-alpha.3 всё ещё
  # требуют zbus ^5.9 — ждём релиза плагина на zbus 6.
  # https://rustsec.org/advisories/RUSTSEC-2026-0370
  # https://rustsec.org/advisories/RUSTSEC-2026-0371
  # https://rustsec.org/advisories/RUSTSEC-2026-0372
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5 через zbus 5 ← tauri-plugin-opener; плагин ещё не перешёл на zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 через zbus 5 ← tauri-plugin-opener; плагин ещё не перешёл на zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 через zvariant ← zbus 5 ← tauri-plugin-opener; плагин ещё не перешёл на zbus 6" },
  # unsafe-libyaml 0.2.11 ← serde_yaml_ng 0.10 — YAML проекта НТ (манифест, реестр, нагрузка, профиль) в крейтах
  # glafira-load-model и glafira-load-contracts. Репозиторий архивирован, безопасной версии нет; уязвимостей
  # не заявлено. Переход на YAML-парсер на безопасном Rust (serde-saphyr) — отдельная задача: формат файлов
  # проекта и порядок ключей должны остаться байт в байт.
  # https://rustsec.org/advisories/RUSTSEC-2024-0449
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml через serde_yaml_ng — YAML файлов проекта; замена парсера запланирована отдельно" },
]
