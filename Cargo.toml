[workspace]
resolver = "2"
members = ["src-tauri", "crates/glafira-load-model", "crates/glafira-load-contracts", "crates/glafira-load-xlsx", "crates/glafira-load-engine"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/vvnovg/glafira-load"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
