name: release

# Установщики 0.1.0 без подписи: тег v* — сборка на трёх платформах, артефакты workflow и
# черновик релиза GitHub с установщиками; вручную — только сборка и артефакты (без релиза).
# Артефакты updater выключены (createUpdaterArtifacts: false), пока в tauri.conf.json заглушка
# ключа: подпись updater, Apple и latest.json появятся на этапе L7.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15
            name: macos-aarch64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      # Черновик релиза и загрузка ассетов в него (только по тегу).
      contents: write
    env:
      BUNDLE: target/release/bundle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      # Без кэшей (ни pnpm, ни rust-cache): кэш, записанный другим запуском (ci.yml), мог бы
      # подменить зависимости или артефакты сборки. Релиз собирается с нуля из lock-файлов.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ветка stable
        with:
          toolchain: stable
      - name: Системные зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      # По тегу tauri-action создаёт черновик релиза (или дополняет уже созданный другой платформой)
      # и прикладывает установщики; вручную tagName пуст — только сборка.
      - name: Сборка установщиков
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2 (v0)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Glafira for Load Testing {0}', github.ref_name) || '' }}
          releaseBody: "Unsigned installers. See CHANGELOG.md for the release notes."
          releaseDraft: true
          prerelease: false
      # Cargo workspace в корне: бандлы лежат в target/release/bundle, а не в src-tauri/target.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.name }}
          path: |
            ${{ env.BUNDLE }}/dmg/*.dmg
            ${{ env.BUNDLE }}/msi/*.msi
            ${{ env.BUNDLE }}/deb/*.deb
            ${{ env.BUNDLE }}/rpm/*.rpm
            ${{ env.BUNDLE }}/appimage/*.AppImage
          if-no-files-found: error
