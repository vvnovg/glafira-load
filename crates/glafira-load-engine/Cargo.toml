[package]
name = "glafira-load-engine"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Glafira for Load Testing: engine"

[dependencies]
glafira-load-model = { path = "../glafira-load-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
thiserror = "2"
hdrhistogram = { version = "7", features = ["serialization"] }
base64 = "0.22"
csv = "1"
rand = "0.9"
regex = "1"
percent-encoding = "2"
form_urlencoded = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "multipart", "stream"] }
rdkafka = { version = "0.37", features = ["cmake-build", "ssl-vendored", "libz-static", "zstd"] }
apache-avro = "0.17"
tar = "0.4"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-stream = "0.1"
eventsource-stream = "0.2"

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
tempfile = "3"
testcontainers = "0.28"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util", "net"] }
