[package]
name = "glafira-load-xlsx"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Glafira for Load Testing: xlsx"

[dependencies]
calamine = "0.37.0"
glafira-load-model = { version = "0.2.0", path = "../glafira-load-model" }
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
